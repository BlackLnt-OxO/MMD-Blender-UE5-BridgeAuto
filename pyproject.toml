[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-bridge"
version = "0.1.0"
description = "MMD Blender Unreal production bridge"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3"]

[project.optional-dependencies]
dev = ["PyInstaller==6.16.0", "pytest==8.4.2"]

[project.scripts]
mmd-bridge = "mmd_bridge.app:main"

[tool.setuptools.packages.find]
include = ["mmd_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
