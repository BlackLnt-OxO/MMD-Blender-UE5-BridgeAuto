[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmd-bridge"
version = "0.3.0"
description = "MMDBridgeForUE — MMD and Blender to Unreal Engine desktop tool"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6==6.8.3",
    # MMM 的 SDK 里没有触发物理烘焙的 API（扫 exe 的 37k 条字符串，
    # "bake" 一次都没出现），所以烘焙只能靠点界面按钮 —— UIA 是硬需求。
    # 见 mmd_bridge/mmm_ui.py。
    "pywinauto==0.6.9",
]

[project.optional-dependencies]
dev = ["PyInstaller==6.16.0", "pytest==8.4.2"]

[project.scripts]
mmd-bridge = "mmd_bridge.app:main"

[tool.setuptools.packages.find]
include = ["mmd_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
